name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Fixed Debug Keystore for Google Sign-In
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          SHA1_FINGERPRINT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FINGERPRINT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "SHA1_FINGERPRINT=$SHA1_FINGERPRINT" >> $GITHUB_ENV
          echo "SHA256_FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV
          echo "Debug Keystore SHA1: $SHA1_FINGERPRINT"
          echo "Debug Keystore SHA256: $SHA256_FINGERPRINT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit Fixed Debug Keystore
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f debug.keystore ]; then
            git add -f debug.keystore
            git commit -m "chore: persist fixed debug keystore for Google Sign-In" || echo "Keystore unchanged"
            git push origin main || echo "Keystore already committed or branch moved"
          fi

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/EBloodDonation-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBloodDonation-debug-apk
          path: release-output/EBloodDonation-debug.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "EBloodDonation App ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '(Latest Build)' }}"
          body: |
            ### 🩸 EBloodDonation Android App
            
            Download the latest APK file below and install it directly on your Android phone!
            
            - **App Name:** EBloodDonation
            - **Package:** `com.EBloodDonation`
            - **Download Link:** [EBloodDonation-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/EBloodDonation-debug.apk)
            
            ---
            ### 🔑 Firebase Google Sign-In Certificate
            Add this SHA-1 to your Firebase Console (*Project Settings -> Your apps -> Add fingerprint*):
            - **SHA-1:** `${{ env.SHA1_FINGERPRINT }}`
            - **SHA-256:** `${{ env.SHA256_FINGERPRINT }}`
          files: release-output/EBloodDonation-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

