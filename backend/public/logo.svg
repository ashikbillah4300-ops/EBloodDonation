<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full">
  <defs>
    <!-- Blood droplet gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <!-- Subtle 3D glossy highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <!-- Heart gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#881337" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Protective Shield / Badge Outline subtle glow -->
  <circle cx="50" cy="50" r="46" fill="#FFF1F2" opacity="0.6" />

  <!-- Main Ruby Blood Drop with Shadow -->
  <path d="M50,8 C50,8 18,50 18,67 C18,84.67 32.33,93 50,93 C67.67,93 82,84.67 82,67 C82,50 50,8 50,8 Z"
        fill="url(#dropGrad)"
        filter="url(#shadow)" />

  <!-- Glossy specular highlight curve on the left shoulder -->
  <path d="M50,14 C47,20 25,52 24,67 C23,76 27,83 33,86 C27,81 24,73 25,65 C26,52 46,23 50,14 Z"
        fill="url(#glossGrad)" />

  <!-- Caring Life Heart Symbol centered inside the droplet -->
  <path d="M50,74 C50,74 34,62 34,51 C34,44.5 39,40 45,40 C48,40 50,42.5 50,42.5 C50,42.5 52,40 55,40 C61,40 66,44.5 66,51 C66,62 50,74 50,74 Z"
        fill="url(#heartGrad)" />

  <!-- Emergency Vital Cross within Heart (Transparent Cutout or Medical Ruby Cross) -->
  <path d="M47.5,46.5 H52.5 V50 H56 V54 H52.5 V58 H47.5 V54 H44 V50 H47.5 Z"
        fill="#E11D48" />

  <!-- Top Shine Sparkle -->
  <circle cx="64" cy="52" r="1.5" fill="#FFFFFF" opacity="0.8" />
</svg>
